services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pssuq
      POSTGRES_PASSWORD: pssuq_local_only
      POSTGRES_DB: pssuq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pssuq_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pssuq -d pssuq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pssuq_data:
